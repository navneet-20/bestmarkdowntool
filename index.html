<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Studio Pro by webline.cloud</title>

  <!-- Marked.js (Markdown Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Highlight.js (Code Syntax Highlighting) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="highlight-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- KaTeX (Math Rendering) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <!-- Mermaid.js (Diagrams) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg-color: #f6f8fa; --panel-bg: #ffffff; --text-color: #1f2328;
      --border-color: #d0d7de; --accent-color: #0969da; --accent-hover: #044289;
      --danger-color: #cf222e; --subtle-text: #636c76; --code-bg: #f6f8fa;
      --tag-bg: #eaf5ff; --tag-color: #0969da;
    }

    [data-theme="dark"] {
      --bg-color: #0d1117; --panel-bg: #161b22; --text-color: #e6edf3;
      --border-color: #30363d; --accent-color: #238636; --accent-hover: #2ea043;
      --danger-color: #da3633; --subtle-text: #848d97; --code-bg: #0d1117;
      --tag-bg: #1f3a5f; --tag-color: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding: 20px; background: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.4rem; font-weight: 600; display: flex; flex-direction: column; }
    h1 span { font-size: 0.8rem; font-weight: normal; color: var(--subtle-text); margin-top: 4px; }
    h1 a { color: var(--accent-color); text-decoration: none; font-weight: bold; transition: opacity 0.2s; }
    h1 a:hover { text-decoration: underline; opacity: 0.8; }
    
    .toolbar, .editor-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .editor-toolbar { background: var(--panel-bg); padding: 8px; border: 1px solid var(--border-color); border-bottom: none; border-radius: 8px 8px 0 0; }
    
    button, select {
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color);
      background: var(--panel-bg); color: var(--text-color); cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all 0.2s ease;
    }
    button:hover, select:hover { filter: brightness(0.95); border-color: var(--subtle-text); }
    button.primary { background: var(--accent-color); color: #ffffff; border: none; }
    button.primary:hover { background: var(--accent-hover); }
    
    .status-bar { font-size: 12px; color: var(--subtle-text); margin-top: 10px; display: flex; justify-content: space-between; }
    
    .main-workspace { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; }
    .container { display: flex; gap: 20px; flex: 1; overflow: hidden; }
    
    .editor-wrapper { display: flex; flex-direction: column; flex: 1; resize: horizontal; overflow: hidden; min-width: 20%; max-width: 80%; }
    textarea, .preview-box {
      flex: 1; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--panel-bg); color: var(--text-color); overflow-y: auto; height: 100%;
    }
    .editor-wrapper textarea { border-radius: 0 0 8px 8px; font-family: ui-monospace, monospace; font-size: 14px; outline: none; line-height: 1.5; }
    textarea:focus { border-color: var(--accent-color); }

    /* Preview Styling */
    .preview-box { line-height: 1.6; position: relative; }
    .preview-box h1, .preview-box h2, .preview-box h3 { margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 16px; }
    .preview-box p, .preview-box ul, .preview-box ol { margin-bottom: 12px; }
    .preview-box ul, .preview-box ol { padding-left: 20px; }
    .preview-box pre { padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 12px; background: var(--code-bg); border: 1px solid var(--border-color); }
    .preview-box blockquote { border-left: 4px solid var(--accent-color); padding-left: 12px; color: var(--subtle-text); }
    .preview-box table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
    .preview-box th, .preview-box td { border: 1px solid var(--border-color); padding: 8px; }
    .mermaid { background: transparent; text-align: center; margin-bottom: 12px; }
    
    /* Nested Tags */
    .hash-tag { background: var(--tag-bg); color: var(--tag-color); padding: 2px 8px; border-radius: 12px; font-size: 0.85em; font-weight: 600; cursor: pointer; display: inline-block; margin: 0 2px; }

    /* Graph View Overlay */
    #graph-overlay {
      display: none; position: absolute; top: 10px; right: 10px; width: 300px; max-height: 80%;
      background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px;
      padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow-y: auto; z-index: 100;
    }
    #graph-overlay h3 { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
    .graph-item { font-size: 13px; margin: 6px 0; color: var(--text-color); cursor: pointer; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--border-color); padding-left: 8px; }
    .graph-item:hover { border-color: var(--accent-color); color: var(--accent-color); }
    .indent-1 { margin-left: 0px; font-weight: bold; border-left: none; padding-left: 0;} 
    .indent-2 { margin-left: 15px; } 
    .indent-3 { margin-left: 30px; }

    /* Zen Mode Hide Classes */
    .hide { display: none !important; }
    body.zen-mode header, body.zen-mode .editor-toolbar, body.zen-mode .status-bar { display: none; }
    
    /* Zen Floating Button */
    #exit-zen-btn {
      display: none; position: fixed; top: 20px; right: 20px; z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 8px 16px; font-weight: bold;
      background: var(--danger-color); color: white; border: none; border-radius: 20px;
    }
    body.zen-mode #exit-zen-btn { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>
      Markdown Studio Pro
      <span>Crafted by <a href="https://navneet.webline.cloud" target="_blank">Navneet Kumar</a> | A tool by <a href="https://webline.cloud/" target="_blank">webline.cloud</a></span>
    </h1>
    <div class="toolbar">
      <button onclick="setView('editor')" title="Editor Only">📝</button>
      <button onclick="setView('split')" title="Split View">🌗</button>
      <button onclick="setView('preview')" title="Preview Only">📖</button>
      <button onclick="toggleZenMode()">🧘 Zen</button>
      <button onclick="toggleGraph()">🗂️ Graph View</button>
      <select id="template-select" onchange="loadTemplate(this.value)">
        <option value="">📋 Templates...</option>
        <option value="default">1. Default Welcome</option>
        <option value="tech">2. Tech & Math Doc</option>
        <option value="meeting">3. Meeting Notes</option>
      </select>
      <button onclick="document.getElementById('file-import').click()">📁 Import</button>
      <input type="file" id="file-import" accept=".md,.txt" style="display:none" onchange="importFile(event)">
      <button onclick="exportFile('md')">💾 Export .md</button>
      <button class="primary" onclick="toggleTheme()">🌙 Theme</button>
    </div>
  </header>

  <button id="exit-zen-btn" onclick="toggleZenMode()">❌ Exit Zen Mode (ESC)</button>

  <main class="main-workspace">
    <div class="editor-toolbar">
      <button onclick="insertText('**', '**')" title="Bold"><b>B</b></button>
      <button onclick="insertText('*', '*')" title="Italic"><i>I</i></button>
      <button onclick="insertText('# ', '')">H1</button>
      <button onclick="insertText('## ', '')">H2</button>
      <button onclick="insertText('> ', '')">Quote</button>
      <button onclick="insertText('```\n', '\n```')">Code</button>
      <button onclick="insertText('$$ \n', '\n $$')">Math</button>
      <button onclick="insertText('```mermaid\n', '\n```')">Diagram</button>
      <span style="font-size: 12px; color: var(--subtle-text); margin-left: auto;">Native Undo Enabled (Ctrl+Z / Ctrl+Y)</span>
    </div>

    <div class="container">
      <div class="editor-wrapper" id="editor-pane">
        <textarea id="markdown-input" placeholder="Type Markdown..."></textarea>
      </div>
      <div id="preview-pane" class="preview-box"></div>
      
      <!-- Graph View Outline -->
      <div id="graph-overlay">
        <h3>Document Graph</h3>
        <div id="graph-content"></div>
      </div>
    </div>
  </main>

  <div class="status-bar">
    <span id="stats">Words: 0 | Chars: 0 | 0 min read</span>
    <span>
      <label><input type="checkbox" id="sync-scroll" checked> Sync Scroll</label> &nbsp; | &nbsp; 
      <span id="save-status">Saved</span>
    </span>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    const renderer = new marked.Renderer();
    renderer.code = function(token) {
      const lang = token.lang || '';
      const code = token.text;
      
      if (lang === 'mermaid') return `<div class="mermaid">${code}</div>`;
      if (lang && hljs.getLanguage(lang)) {
        try {
          return `<pre><code class="hljs language-${lang}">${hljs.highlight(code, { language: lang }).value}</code></pre>`;
        } catch(e) {}
      }
      return `<pre><code class="hljs">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
    };

    const tagExtension = {
      name: 'nestedTag',
      level: 'inline',
      start(src) { return src.match(/#[a-zA-Z0-9_-]+/)?.index; },
      tokenizer(src) {
        const rule = /^#([a-zA-Z0-9_-]+(?:\/[a-zA-Z0-9_-]+)*)/;
        const match = rule.exec(src);
        if (match) return { type: 'nestedTag', raw: match[0], text: match[1] };
      },
      renderer(token) { return `<span class="hash-tag">#${token.text}</span>`; }
    };

    marked.use({ renderer, extensions: [tagExtension] });

    const input = document.getElementById('markdown-input');
    const preview = document.getElementById('preview-pane');

    // Smart Keystroke Intercepts (Auto-pair & Tab)
    input.addEventListener('keydown', (e) => {
      // 1. Tab Key for indentation
      if (e.key === 'Tab') {
        e.preventDefault();
        insertText('  '); // Insert 2 spaces
      }
      
      // 2. Auto-pair Brackets
      const pairs = { '(': ')', '[': ']', '{': '}', '`': '`' };
      if (pairs[e.key]) {
        e.preventDefault();
        insertText(e.key, pairs[e.key]);
        // Move cursor between the brackets
        input.setSelectionRange(input.selectionStart - 1, input.selectionStart - 1);
      }
    });

    input.addEventListener('input', () => {
      updateAll();
    });

    async function updateAll() {
      let rawText = input.value;

      // Dynamic Table of Contents Generator [[TOC]]
      if (rawText.includes('[[TOC]]')) {
        const tocRegex = /^(#{1,3})\s+(.*)$/gm;
        let match, toc = '### Table of Contents\n';
        while ((match = tocRegex.exec(rawText)) !== null) {
          const level = match[1].length - 1;
          const indent = '  '.repeat(level);
          toc += `${indent}- [${match[2]}](#)\n`; // Simple display TOC
        }
        rawText = rawText.replace('[[TOC]]', toc);
      }
      
      preview.innerHTML = marked.parse(rawText);

      if (window.renderMathInElement) {
        renderMathInElement(preview, {
          delimiters: [ {left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false} ],
          throwOnError: false
        });
      }

      try {
        await mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
      } catch (e) {}

      updateStats(rawText);
      updateGraph(rawText);
      localStorage.setItem('md_studio_content', input.value); // Always save raw input
      document.getElementById('save-status').innerText = 'Saved';
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('md_studio_theme') === 'dark') applyTheme('dark');
      input.value = localStorage.getItem('md_studio_content') || templates.default;
      setTimeout(updateAll, 200); 
    });

    function updateStats(text) {
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('stats').innerText = `Words: ${words} | Chars: ${text.length} | ~${Math.ceil(words/200)} min read`;
    }

    // Graph View 
    function toggleGraph() {
      const graph = document.getElementById('graph-overlay');
      graph.style.display = graph.style.display === 'block' ? 'none' : 'block';
    }
    
    function updateGraph(text) {
      const graphContent = document.getElementById('graph-content');
      const regex = /^(#{1,3})\s+(.*)$/gm;
      let match, html = '';
      while ((match = regex.exec(text)) !== null) {
        const level = match[1].length;
        html += `<div class="graph-item indent-${level}">${match[2]}</div>`;
      }
      graphContent.innerHTML = html || "<span style='color:gray; font-size:12px;'>No headers found.</span>";
    }

    function importFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        input.value = e.target.result;
        updateAll(); 
        showStatus("File Imported!");
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Flawless Insert Text Logic (Preserves Native Undo Stack)
    function insertText(before, after = '') {
      const start = input.selectionStart, end = input.selectionEnd;
      const selected = input.value.substring(start, end);
      const replacement = before + selected + after;
      
      input.focus();
      
      // execCommand is magical here: it acts like user typing, preserving browser Ctrl+Z history!
      if (!document.execCommand('insertText', false, replacement)) {
        // Fallback for extreme edge cases
        input.setRangeText(replacement, start, end, 'end');
      }

      // Re-highlight the text between the wrappers
      if (after) {
         input.setSelectionRange(start + before.length, start + before.length + selected.length);
      }
      updateAll();
    }

    function toggleTheme() {
      applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      mermaid.initialize({ theme: theme === 'dark' ? 'dark' : 'default' });
      localStorage.setItem('md_studio_theme', theme);
      updateAll(); 
    }

    function setView(mode) {
      const editor = document.getElementById('editor-pane');
      editor.classList.remove('hide'); preview.classList.remove('hide');
      if (mode === 'editor') preview.classList.add('hide');
      if (mode === 'preview') editor.classList.add('hide');
      editor.style.width = mode === 'split' ? '50%' : '100%';
    }

    // Zen Mode Exit triggers
    function toggleZenMode() { 
      document.body.classList.toggle('zen-mode'); 
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('zen-mode')) {
        toggleZenMode();
      }
    });
    
    function exportFile(ext) {
      const blob = new Blob([input.value], { type: 'text/markdown' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `document_webline_cloud.${ext}`; a.click();
    }

    function showStatus(text) {
      const s = document.getElementById('save-status'); s.innerText = text;
      setTimeout(() => s.innerText = "Saved", 2500);
    }

    input.addEventListener('scroll', () => {
      if (document.getElementById('sync-scroll').checked) {
        const p = input.scrollTop / (input.scrollHeight - input.clientHeight);
        preview.scrollTop = p * (preview.scrollHeight - preview.clientHeight);
      }
    });

    const templates = {
      default: `# Welcome to Markdown Studio Pro
Built by Navneet Kumar for webline.cloud

### Features Working Now:
1. **Flawless Undo/Redo**: Use native \`Ctrl+Z\` & \`Ctrl+Y\`.
2. **Auto-Pairing**: Type \`(\` or \`[\` to auto-close!
3. **Table of Contents**: Type \`[[TOC]]\` anywhere to generate an instant TOC.
4. **Zen Mode**: Press ESC or click the red floating button to exit.

[[TOC]]

## 1. Quick Example
Test typing your markdown here.

## 2. Next Steps
Try the dropdown template above for Tech Docs!`,
      
      tech: `# System Architecture #tech/docs/v2
Testing Math and Diagrams.

[[TOC]]

## 1. Complex Formula
The equation is calculated as:
$$ x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a} $$

## 2. Server Architecture
\`\`\`mermaid
graph TD;
    Client-->LoadBalancer;
    LoadBalancer-->Node1;
    LoadBalancer-->Node2;
    Node1-->Database;
    Node2-->Database;
\`\`\`
`,
      meeting: `# Weekly Sync #meetings/q3
**Date:** Oct 24 | **Lead:** Navneet

## Agenda
1. Review Server Costs
2. Deploy new webline.cloud features

## Action Items
- [ ] Setup DNS for new subdomains
- [ ] Review PR #42
`
    };

    function loadTemplate(key) {
      if (!key) return;
      input.value = templates[key];
      document.getElementById('template-select').value = ''; 
      updateAll(); showStatus("Template Loaded");
    }
  </script>
</body>
</html>
